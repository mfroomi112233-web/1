name: publish

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: publish-main
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install requirements
        run: sudo apt-get update && sudo apt-get install -y curl

      - name: Build and run
        run: |
          curl -L https://raw.githubusercontent.com/qeeqbox/global-scripts/main/auto-checking.sh -o auto-checking.sh
          chmod +x auto-checking.sh
          ./auto-checking.sh social-analyzer

      - name: Commit and push
        run: |
          git config user.name "qb-auto"
          git config user.email "qbactions@gmail.com"

          git add -- . ':!auto-checking.sh'

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "🤖"

          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main

      - name: Delete auto-checking.sh
        if: always()
        run: rm -f auto-checking.sh
